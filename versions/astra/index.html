<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#191720">
  <title>夕陽郵航 ｜ 貓掌遊戲室</title>
  <link rel="icon" href="../../assets/stamp.png">
  <link rel="stylesheet" href="style.css">
  <script src="game.js" defer></script>
</head>
<body>
<svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
 <symbol id="cat" viewBox="0 0 32 28"><path fill="currentColor" d="M2 3h4v3h3v3h14V6h3V3h4v19h-3v3h-4v2H9v-2H5v-3H2z"/><path fill="#2b2028" d="M6 9h2v3H6zm18 0h2v3h-2zM8 15h3v3H8zm13 0h3v3h-3zm-7 3h4v2h-4z"/><path fill="#ffad75" d="M5 19h5v2H5zm17 0h5v2h-5z"/></symbol>
 <symbol id="sound" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zm12-1a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></symbol>
 <symbol id="mute" viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3zm13 0 5 6m0-6-5 6"/></symbol>
 <symbol id="expand" viewBox="0 0 24 24"><path d="M4 9V4h5m6 0h5v5m0 6v5h-5m-6 0H4v-5"/></symbol>
 <symbol id="trophy" viewBox="0 0 24 24"><path d="M7 4h10v6a5 5 0 0 1-10 0zm0 2H4v3a4 4 0 0 0 4 4m9-7h3v3a4 4 0 0 1-4 4m-4 2v4m-4 1h8"/></symbol>
 <symbol id="heart" viewBox="0 0 16 15"><path d="M1 2h2V1h3v1h1v1h2V2h1V1h3v1h2v2h1v4h-2v2h-2v2h-2v2H8v1H7v-2H5v-2H3V9H1V7H0V4h1z" fill="currentColor" stroke="none"/></symbol>
 <symbol id="plane" viewBox="0 0 24 24"><path d="m2 10 20-7-7 18-4-7-9-4zm9 4L22 3"/></symbol>
 <symbol id="pin" viewBox="0 0 24 24"><path d="M19 10c0 5-7 12-7 12S5 15 5 10a7 7 0 0 1 14 0Z"/><circle cx="12" cy="10" r="2"/></symbol>
 <symbol id="flag" viewBox="0 0 24 24"><path d="M5 21V4m0 1c5-5 9 4 15-1v10c-6 5-10-4-15 1"/></symbol>
 <symbol id="keyboard" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M5 9h2m2 0h2m2 0h2m2 0h2M5 12h2m2 0h2m2 0h2m2 0h2M7 15h10"/></symbol>
 <symbol id="book" viewBox="0 0 24 24"><path d="M12 6C9 4 5 4 2 5v14c3-1 7-1 10 1 3-2 7-2 10-1V5c-3-1-7-1-10 1Zm0 0v14"/></symbol>
 <symbol id="pause" viewBox="0 0 24 24"><path d="M7 5h3v14H7zm7 0h3v14h-3z" fill="currentColor" stroke="none"/></symbol>
</svg>
<header>
 <div class="header-inner">
  <div class="brand"><svg class="cat-mark"><use href="#cat"/></svg><strong>貓掌遊戲室</strong></div>
  <div class="tools"><button id="audio" type="button" aria-pressed="true"><svg><use href="#sound"/></svg><span>音效開啟</span></button><button id="fullscreen" type="button" title="全螢幕" aria-label="全螢幕"><svg><use href="#expand"/></svg></button></div>
 </div>
</header>
<main>
 <section class="cabinet" aria-label="夕陽郵航遊戲機">
  <div class="hud">
   <div class="state"><i></i><span id="state">準備起飛</span></div>
   <div class="stats">
    <div class="stat"><span>得分</span><b id="score">00000</b></div>
    <div class="stat record"><svg><use href="#trophy"/></svg><span>最高紀錄</span><b id="best">00000</b></div>
    <div class="stat lifes"><span>生命</span><div id="hearts" role="img" aria-label="三顆愛心"></div></div>
   </div>
  </div>
  <div class="stage" id="stage">
   <canvas id="game" width="1200" height="460" aria-label="用方向鍵移動紙飛機，收集郵票並躲開雷雲"></canvas>
   <div class="cover" id="cover">
    <div class="intro">
     <div class="route-label"><svg><use href="#plane"/></svg>海港航線<span></span>第 01 班</div>
     <h1 id="headline">夕陽郵航</h1>
     <p id="description">與郵差貓「柑仔」一起駕著紙飛機，<br>收集散落在晚霞裡的夕陽郵票。</p>
     <button class="launch" id="launch" disabled><span class="triangle"></span><strong>開始飛行</strong><kbd>↵</kbd></button>
    </div>
   </div>
   <div id="flight-tools" hidden><span id="chain">集章 0／3</span><button id="pause" aria-label="暫停飛行" title="暫停"><svg><use href="#pause"/></svg></button></div>
   <div class="frame-corner tl"></div><div class="frame-corner tr"></div><div class="frame-corner bl"></div><div class="frame-corner br"></div>
  </div>
  <div class="route"><span><svg><use href="#pin"/></svg>橘灣郵局</span><div class="route-line"><i id="route-progress"><svg><use href="#plane"/></svg></i></div><span><svg><use href="#flag"/></svg>日落燈塔</span></div>
 </section>
 <div class="guides">
  <section class="guide controls"><h2><svg><use href="#keyboard"/></svg>操作指南</h2>
   <div class="control-items"><div class="control"><div class="keys"><kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd></div><span>移動飛機</span></div><i></i><div class="control"><kbd>P</kbd><span>暫停</span></div></div>
   <p class="touch-hint">觸控操作<span>／</span>拖曳畫面移動飛機</p>
  </section>
  <section class="guide"><h2><svg><use href="#book"/></svg>航線圖鑑</h2>
   <div class="items"><div class="item"><div class="tile"><img src="../../assets/stamp.png" alt=""></div><div><b>夕陽郵票</b><small>收集 <em>＋100</em> 分</small></div></div><i></i><div class="item"><div class="tile storm"><img src="../../assets/cloud.png" alt=""></div><div><b>搗蛋雷雲</b><small>碰撞 <em>－1</em> 生命</small></div></div></div>
    <p class="touch-hint">連續收齊三枚郵票，額外獲得 150 分。</p>
  </section>
 </div>
</main>
<div class="sr" id="announce" role="status" aria-live="polite"></div>
</body>
</html>
