<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>兩個 AI 做的遊戲 對決兩回合</title>
  <meta name="description" content="GPT-6.2 Astra 對 Claude Fable 5.2，兩回合遊戲對決：第一回合《夕陽郵航》，第二回合照 GG-skills v4.0 做《Lantern Drift》天燈漂流。同一頁切換著玩。">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="zh_TW">
  <meta property="og:title" content="兩個 AI 做的遊戲 對決兩回合">
  <meta property="og:description" content="第二回合：兩個 AI 照 GameGen 技能包從零做天燈漂流。打開就能切換著玩。">
  <meta property="og:url" content="https://jambocoder159.github.io/ai-game-duel/">
  <meta property="og:image" content="https://jambocoder159.github.io/ai-game-duel/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="兩個 AI 做的遊戲 對決兩回合">
  <meta name="twitter:description" content="第二回合：兩個 AI 照 GameGen 技能包從零做天燈漂流。打開就能切換著玩。">
  <meta name="twitter:image" content="https://jambocoder159.github.io/ai-game-duel/og-image.jpg">
  <link rel="icon" type="image/png" href="assets/stamp.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#play-btn">跳到遊戲</a>
  <header class="top">
    <p class="eyebrow">公開測試</p>
    <h1>兩個 AI 做的遊戲 對決兩回合</h1>
    <p class="lede">GPT-6.2 Astra 和 Claude Fable 5.2 拿同一個題目各做一款遊戲。第一回合用同一組素材做貓咪郵差，第二回合照團隊的 GameGen 技能包 GG-skills v4.0 從零做《Lantern Drift》天燈漂流。先選回合，再切換版本，直接在瀏覽器裡玩。</p>
  </header>
  <main>
    <div class="rounds" role="tablist" aria-label="選擇回合">
      <button type="button" role="tab" id="round-r1" data-round="r1" aria-controls="round-panel" aria-selected="false" tabindex="-1">第一回合　夕陽郵航</button>
      <button type="button" role="tab" id="round-r2" data-round="r2" aria-controls="round-panel" aria-selected="true" tabindex="0">第二回合　天燈漂流 GG-skills v4.0</button>
    </div>
    <section id="round-panel" role="tabpanel" aria-labelledby="round-r2">
      <p id="round-note" class="note"></p>
      <div class="toolbar">
        <div class="tabs" role="tablist" aria-label="選擇遊戲版本">
          <button type="button" role="tab" id="tab-astra" data-version="astra" aria-controls="panel-game" aria-selected="true" tabindex="0">GPT-6.2 Astra</button>
          <button type="button" role="tab" id="tab-fable" data-version="fable" aria-controls="panel-game" aria-selected="false" tabindex="-1">Claude Fable 5.2</button>
        </div>
        <p id="version-stats" class="stats"></p>
        <button type="button" id="play-btn">開始玩</button>
      </div>
      <div id="panel-game" class="stage" role="tabpanel" aria-labelledby="tab-astra">
        <iframe id="play-frame" title="遊戲畫面" src="about:blank" tabindex="0" allow="fullscreen"></iframe>
      </div>
    </section>
  </main>
  <footer>
    <p>這個頁面是公開的，沒有密碼、沒有登入、也沒有追蹤。四個遊戲都在你的瀏覽器裡跑。鍵盤遊玩前請先按「開始玩」，讓焦點進入遊戲畫面。</p>
  </footer>
  <script src="app.js"></script>
</body>
</html>
